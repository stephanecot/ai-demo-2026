[project]
name = "cra-backend"
version = "0.1.0"
description = "CRA — timesheet API (FastAPI + SQLAlchemy + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in an argument default is the FastAPI idiom, not a mutable default.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The 70% floor of `python-do.md` is enforced by the runner, not by good intentions.
# `uv run pytest --no-cov` skips it while iterating on a single test.
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["app"]
branch = true
# Package markers hold a docstring and, for `models`, the re-exports that make
# `Base.metadata` complete. They carry no behaviour a test could assert, and importing
# the app already executes them, so measuring them would only inflate the percentage.
omit = ["app/__init__.py", "app/*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
