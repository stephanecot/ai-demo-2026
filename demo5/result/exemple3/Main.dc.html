<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: "Public Sans", system-ui, sans-serif; }
    a { color: #12408c; } a:hover { color: #0c2f69; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #f4f4f1; color: #14181d; display: flex; flex-direction: column; overflow: hidden;">

  <!-- en-tête -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 28px 20px 16px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 14px; color: #5b6570;">Bonjour</span>
      <span style="font-family: Archivo, system-ui, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.02em;">Camille</span>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 22px; background: #12408c; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: Archivo, system-ui, sans-serif; font-size: 16px; font-weight: 600;">CM</div>
  </div>

  <!-- carte : mon vélo -->
  <div style="margin: 0 20px; padding: 20px; border-radius: 22px; background: #ffffff; border: 1px solid #e3e3dd; display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5b6570;">Mon vélo</span>
        <span style="font-family: Archivo, system-ui, sans-serif; font-size: 20px; font-weight: 600;">Cargo Longtail C2</span>
        <span style="font-size: 14px; color: #5b6570;">Immatriculé 59-VLC-0482</span>
      </div>
      <svg width="52" height="36" viewBox="0 0 52 36" fill="none" aria-hidden="true">
        <circle cx="12" cy="24" r="9" stroke="#14181d" stroke-width="2"/>
        <circle cx="40" cy="24" r="9" stroke="#14181d" stroke-width="2"/>
        <path d="M12 24 24 9h10l6 15" stroke="#12408c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 9h-6" stroke="#14181d" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 14px; color: #5b6570;">Autonomie de la batterie</span>
        <span style="font-family: Archivo, system-ui, sans-serif; font-size: 16px; font-weight: 600;">72 %</span>
      </div>
      <div style="height: 10px; border-radius: 5px; background: #e8e8e2; overflow: hidden;">
        <div style="width: 72%; height: 10px; border-radius: 5px; background: #12408c;"></div>
      </div>
      <span style="font-size: 14px; color: #5b6570;">environ 46 km restants</span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding-top: 16px; border-top: 1px solid #ededea;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="2.5" y="4" width="15" height="13.5" rx="2.5" stroke="#5b6570" stroke-width="1.7"/>
        <path d="M2.5 8h15M6.5 2.5v3M13.5 2.5v3" stroke="#5b6570" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span style="font-size: 15px;">Prochaine révision le <strong style="font-weight: 600;">12 juin</strong></span>
    </div>
  </div>

  <!-- raccourcis -->
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 24px 20px 0;">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5b6570;">Raccourcis</span>

    <div style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 18px; border-radius: 18px; background: #12408c; color: #ffffff;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2.5" stroke="#ffffff" stroke-width="1.9"/>
        <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <span style="flex-grow: 1; font-size: 17px; font-weight: 600;">Déverrouiller mon vélo</span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="m7.5 4 6 6-6 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 18px; border-radius: 18px; background: #ffffff; border: 1px solid #e3e3dd;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 4.5 21 19.5H3L12 4.5Z" stroke="#14181d" stroke-width="1.9" stroke-linejoin="round"/>
        <path d="M12 10v4M12 16.8v.2" stroke="#14181d" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <span style="flex-grow: 1; font-size: 17px; font-weight: 500;">Signaler un problème</span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="m7.5 4 6 6-6 6" stroke="#8b939c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 18px; border-radius: 18px; background: #ffffff; border: 1px solid #e3e3dd;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z" stroke="#14181d" stroke-width="1.9" stroke-linejoin="round"/>
        <circle cx="12" cy="10" r="2.6" stroke="#14181d" stroke-width="1.9"/>
      </svg>
      <span style="flex-grow: 1; font-size: 17px; font-weight: 500;">Trouver une agence</span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="m7.5 4 6 6-6 6" stroke="#8b939c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- barre d'onglets -->
  <div style="display: flex; align-items: stretch; gap: 4px; padding: 10px 12px 26px; background: #ffffff; border-top: 1px solid #e3e3dd;">
    <div style="flex-grow: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 14px; color: #12408c;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="#12408c" stroke-width="1.9" stroke-linejoin="round"/>
      </svg>
      <span style="font-size: 12px; font-weight: 600;">Accueil</span>
    </div>
    <div style="flex-grow: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 14px; color: #5b6570;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.5" y="6" width="17" height="12" rx="2.5" stroke="#5b6570" stroke-width="1.9"/>
        <path d="M3.5 10h17" stroke="#5b6570" stroke-width="1.9"/>
      </svg>
      <span style="font-size: 12px;">Abonnement</span>
    </div>
    <div style="flex-grow: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 14px; color: #5b6570;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12a7 7 0 0 1 14 0v5a2 2 0 0 1-2 2h-2" stroke="#5b6570" stroke-width="1.9" stroke-linecap="round"/>
        <rect x="3.5" y="11" width="4" height="6" rx="1.6" stroke="#5b6570" stroke-width="1.9"/>
        <rect x="16.5" y="11" width="4" height="6" rx="1.6" stroke="#5b6570" stroke-width="1.9"/>
      </svg>
      <span style="font-size: 12px;">Assistance</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
